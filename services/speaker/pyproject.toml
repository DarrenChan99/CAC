[project]
name = "caretaker-speaker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0", "torchaudio==2.11.0",
  "speechbrain==1.1.2", "silero-vad==6.2.3",
  "pyannote.audio==4.0.7", "pyannote.metrics==4.2.0",
  "sounddevice==0.5.6", "mlx-whisper==0.4.3",
  "soundfile", "numpy", "scikit-learn", "matplotlib", "websockets", "pytest",
]

[tool.setuptools]
packages = ["caretaker_speaker"]

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
